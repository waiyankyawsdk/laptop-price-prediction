<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predict laptop prices instantly using machine learning. Explore data insights and model performance for smart buying decisions.">
    <title>{% block title %}Laptop Price Prediction{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Plotly.js for interactive charts -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Custom Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- ── NAVBAR ── -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">Laptop Price Prediction</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/prediction' %}active{% endif %}" href="/prediction">Prediction</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/data-analysis' %}active{% endif %}" href="/data-analysis">Data Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/model-performance' %}active{% endif %}" href="/model-performance">Model Performance</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ── PAGE WRAPPER ── -->
    <div class="page-wrapper">
        {% block content %}{% endblock %}

        <!-- ── FOOTER ── -->
        <footer>
            <p><strong>© 2026 Laptop Price Prediction</strong></p>
            <p>Built with Python · Flask · scikit-learn · Machine Learning</p>
        </footer>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Plotly.js for interactive charts -->
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>

    <!-- Active nav highlight fallback -->
    <script>
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === window.location.pathname) {
                link.classList.add('active');
            }
        });

        // Fix Plotly charts not rendering (black box issue)
        window.addEventListener('load', function() {
            // If Plotly is loaded and there are plotly graphs on the page
            if (typeof Plotly !== 'undefined') {
                document.querySelectorAll('.plotly').forEach(function(graph) {
                    Plotly.relayout(graph, {autosize: true});
                });
            }
        });
    </script>

</body>
</html>
